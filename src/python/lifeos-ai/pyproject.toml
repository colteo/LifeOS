[project]
name = "lifeos-ai"
version = "0.1.0"
description = "LifeOS production AI service (stateless; no database access)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.10",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.15,<0.16"]

[build-system]
requires = ["uv_build==0.12.19"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
