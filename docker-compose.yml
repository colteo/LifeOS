services:
  postgres:
    # AI-004: PostgreSQL 18 with the pgvector extension (the journal memory migration creates it).
    # Same major and data layout as postgres:18, so an existing volume keeps working.
    image: pgvector/pgvector:0.8.6-pg18-trixie
    container_name: lifeos-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - lifeos_postgres_data:/var/lib/postgresql

volumes:
  lifeos_postgres_data: