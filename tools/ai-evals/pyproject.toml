[project]
name = "lifeos-ai-evals"
version = "0.1.0"
description = "Local synthetic LifeOS evaluation laboratory"
requires-python = ">=3.12"
dependencies = [
    "langchain-groq>=1.1.3",
    # AI-003: the production AI service package, so live adapters reuse its prompts, schemas and
    # transport instead of copies. One direction only: lifeos-ai never imports this lab.
    "lifeos-ai",
    # AI-005: PostgreSQL driver for the DISPOSABLE pgvector evaluation database only (the
    # production service stays database-free; AI-004 section 21).
    "psycopg[binary]>=3.2,<4",
]

[tool.uv.sources]
lifeos-ai = { path = "../../src/python/lifeos-ai", editable = true }

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.15,<0.16"]

[build-system]
requires = ["uv_build==0.12.19"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
